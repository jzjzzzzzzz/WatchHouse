name: test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: test -z "$(gofmt -l cmd internal 2>/dev/null)"
      - run: go vet ./...
      - run: go test -race -cover ./...
      - run: go test ./internal/telemetry -run '^$' -fuzz FuzzParseJournal -fuzztime 10s
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: make linux
      - run: make smoke
      - run: make crash
